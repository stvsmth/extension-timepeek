<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Timepeek</title>
        <link rel="stylesheet" href="timepeek.css" />
    </head>
    <body>
        <script src="../scripts/formatter.js"></script>
        <script src="../scripts/settings.js"></script>
        <script src="timepeek.js"></script>
        <div class="container">
            <div class="border"></div>
            <div class="loading">
                <h1 class="center">LOADING...</h1>
            </div>
            <div class="content dn">
                <div class="title center">
                    <img src="../icons/timepeek-128.png" alt="Logo" />
                </div>

                <h2 class="center icon">Timepeek <span id="version"></span></h2>

                <div class="divider w100"></div>

                <div class="settings mt20">
                      <div class="preview w100">
                          <label for="timepeek-preview">Preview</label>
                          <input
                              type="text"
                               id="timepeek-preview"
                               readonly
                          />
                      </div>
                      <div class="w100">
                          <input type="checkbox" id="timepeek-include-region" checked />
                          <label for="timepeek-include-region">Include region in preview</label>
                      </div>
                      <div class="format w100">
                          <label for="timepeek-format">Format</label>
                          <input
                              type="text"
                              id="timepeek-format"
                              title="Supported tokens: YYYY YY MMMM MMM MM M DD D dddd ddd dd d HH H hh h mm m ss s SSS A a Z ZZ — wrap literal text in [brackets]"
                          />
                          <a
                              target="_blank"
                              href="https://day.js.org/docs/en/display/format"
                          >
                             Day.js Format Docs (supported subset in tooltip)
                          </a>
                      </div>
                      <div class="timezones w100">
                          <label for="timepeek-timezones-input">Timezones</label>
                          <div id="timezones-container">
                              <input
                                  type="text"
                                  id="timepeek-timezones-input"
                                  list="timezones"
                              />
                          </div>
                          <datalist id="timezones"></datalist>
                      </div>
                      <button id="timepeek-grant" class="dn">Grant page access</button>
                </div>
            </div>
        </div>
    </body>
</html>
